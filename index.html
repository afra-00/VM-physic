<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>چگالی | Hogwarts Density Lab</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --sly-green: #1a472a;
      --sly-green-light: #2a623d;
      --sly-green-bright: #3d8b5a;
      --sly-silver: #c0c0c0;
      --sly-silver-dark: #8a8a8a;
      --sly-bg: #0d1a12;
      --sly-card: #132619;
      --sly-border: #2f5c40;
      --accent: #b44fd4;
      --accent-soft: rgba(180, 79, 212, 0.5);
      --liquid-top: rgba(123, 45, 142, 0.85);
      --liquid-mid: #2d1b4e;
      --liquid-deep: #0a0415;
      --magic-glow: #b44fd4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: var(--sly-bg);
      color: var(--sly-silver);
      min-height: 100vh;
      overflow-x: hidden;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(42, 98, 61, 0.25) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(26, 71, 42, 0.3) 0%, transparent 40%);
      transition: background 0.8s ease, color 0.5s ease;
    }

    /* ====== HOUSE VERTICAL BAR (top-right) ====== */
    .house-bar {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 10px;
      background: rgba(13, 26, 18, 0.85);
      border: 1px solid var(--sly-border);
      border-radius: 40px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.5);
      transition: background 0.6s, border-color 0.6s;
    }

    .house-btn {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      background: rgba(255,255,255,0.06);
      transition: transform 0.25s, box-shadow 0.25s, background 0.25s, border-color 0.25s;
    }

    .house-btn:hover { transform: scale(1.12); }

    .house-btn[data-house="slytherin"] { border-color: #2a623d; }
    .house-btn[data-house="gryffindor"] { border-color: #7f1d1d; }
    .house-btn[data-house="ravenclaw"] { border-color: #1e3a5f; }
    .house-btn[data-house="hufflepuff"] { border-color: #8a6d1a; }

    .house-btn[data-house="slytherin"]:hover,
    .house-btn[data-house="slytherin"].active {
      background: linear-gradient(145deg, #2a623d, #1a472a);
      box-shadow: 0 0 16px rgba(61,139,90,0.9);
    }
    .house-btn[data-house="gryffindor"]:hover,
    .house-btn[data-house="gryffindor"].active {
      background: linear-gradient(145deg, #a71d2a, #7f1d1d);
      box-shadow: 0 0 16px rgba(200,40,60,0.9);
    }
    .house-btn[data-house="ravenclaw"]:hover,
    .house-btn[data-house="ravenclaw"].active {
      background: linear-gradient(145deg, #2b6fa8, #1e3a5f);
      box-shadow: 0 0 16px rgba(70,140,220,0.9);
    }
    .house-btn[data-house="hufflepuff"]:hover,
    .house-btn[data-house="hufflepuff"].active {
      background: linear-gradient(145deg, #d4a017, #8a6d1a);
      box-shadow: 0 0 16px rgba(240,200,60,0.9);
    }

    header {
      text-align: center;
      padding: 28px 20px 10px;
      border-bottom: 1px solid var(--sly-border);
      background: linear-gradient(180deg, rgba(26,71,42,0.4), transparent);
      transition: background 0.8s, border-color 0.8s;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.9rem;
      color: var(--sly-silver);
      letter-spacing: 3px;
      text-shadow: 0 0 20px var(--accent-soft);
      transition: text-shadow 0.6s;
    }

    header p {
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--accent);
      opacity: 0.9;
      transition: color 0.6s;
    }

    .lab {
      max-width: 720px;
      margin: 0 auto;
      padding: 30px 20px 100px;
    }

    .stage {
      height: 380px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 30px;
      position: relative;
    }

    .shape-container {
      position: relative;
      transition: all 0.5s ease;
    }

    /* ====== WAND ====== */
    .wand {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) rotate(-22deg);
      transform-origin: bottom center;
      width: 10px;
      height: 200px;
      z-index: 50;
      pointer-events: none;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,0.6));
      animation: wandSway 3.5s infinite ease-in-out;
    }

    @keyframes wandSway {
      0%, 100% { transform: translateX(-50%) rotate(-22deg); }
      50% { transform: translateX(-50%) rotate(-17deg); }
    }

    .wand-handle {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 60px;
      background: linear-gradient(90deg, #3b1f0f, #6b3a1a, #3b1f0f);
      border-radius: 5px;
      border: 1px solid #8a5a2b;
    }

    .wand-shaft {
      position: absolute; top: 58px; left: 1px;
      width: 8px; height: 130px;
      background: linear-gradient(90deg, #5c3818, #a06a3a, #5c3818);
      border-radius: 4px;
    }

    .wand-tip {
      position: absolute; bottom: 4px; left: 50%;
      transform: translateX(-50%);
      width: 14px; height: 14px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff, var(--magic-glow) 55%, transparent 75%);
      box-shadow:
        0 0 12px var(--magic-glow),
        0 0 26px var(--magic-glow),
        0 0 44px var(--accent-soft);
      animation: tipGlow 1.8s infinite ease-in-out;
      transition: box-shadow 0.6s, background 0.6s;
    }

    @keyframes tipGlow {
      0%, 100% { opacity: 0.8; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.35); }
    }

    /* Cylinder */
    .cylinder {
      width: 160px; height: 240px;
      background: linear-gradient(90deg, #1e3a2a, #2a4a35, #1e3a2a);
      border: 3px solid var(--sly-silver-dark);
      border-radius: 8px / 20px;
      position: relative; overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 15px 35px rgba(0,0,0,0.5);
    }
    .cylinder::before {
      content: ''; position: absolute; top: -12px; left: -3px; right: -3px; height: 24px;
      background: linear-gradient(90deg, #2a4a35, #3d6b4a, #2a4a35);
      border: 3px solid var(--sly-silver-dark);
      border-radius: 50%;
      z-index: 2;
    }

    /* Cube */
    .cube {
      width: 180px; height: 180px;
      background: linear-gradient(145deg, #1e3a2a, #2a4a35);
      border: 3px solid var(--sly-silver-dark);
      position: relative; overflow: hidden;
      box-shadow: 8px 8px 0 #152a1c, 0 15px 35px rgba(0,0,0,0.5);
      transform: rotateX(8deg) rotateY(-8deg);
    }

    /* Cuboid */
    .cuboid {
      width: 220px; height: 150px;
      background: linear-gradient(145deg, #1e3a2a, #2a4a35);
      border: 3px solid var(--sly-silver-dark);
      position: relative; overflow: hidden;
      box-shadow: 10px 10px 0 #152a1c, 0 15px 35px rgba(0,0,0,0.5);
    }

    /* Pyramid - now with clip-path for proper liquid */
    .pyramid {
      width: 220px; height: 200px;
      position: relative;
      overflow: hidden;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      background: linear-gradient(180deg, #2a4a35, #1e3a2a);
      filter: drop-shadow(0 12px 20px rgba(0,0,0,0.5));
      border: none;
    }
    .pyramid::after {
      content: '';
      position: absolute;
      inset: 0;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
      border: 3px solid var(--sly-silver-dark);
      pointer-events: none;
    }

    /* Sphere */
    .sphere {
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #3d6b4a, #1e3a2a 60%, #0f2015);
      border: 3px solid var(--sly-silver-dark);
      position: relative; overflow: hidden;
      box-shadow: inset -20px -20px 40px rgba(0,0,0,0.4), 0 15px 40px rgba(0,0,0,0.5);
    }

    /* ====== MAGIC LIQUID ====== */
    .water {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(180deg,
        var(--liquid-top) 0%,
        var(--liquid-mid) 40%,
        var(--liquid-deep) 100%
      );
      transition: height 0.45s cubic-bezier(0.4, 0, 0.2, 1), background 0.8s ease;
      overflow: hidden;
      box-shadow:
        inset 0 8px 20px var(--accent-soft),
        inset 0 -5px 15px rgba(0,0,0,0.8);
      animation: magicPulse 4s infinite ease-in-out;
      z-index: 1;
    }

    @keyframes magicPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.22); }
    }

    .cylinder .water { border-radius: 0 0 5px 5px; }
    .cube .water, .cuboid .water { border-radius: 0; }
    .sphere .water { border-radius: 0 0 50% 50%; }

    .water::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 16px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      border-radius: 50% 50% 0 0;
      box-shadow: 0 -2px 12px var(--accent-soft), 0 0 20px var(--accent-soft);
      animation: surfaceGlow 3s infinite ease-in-out;
      transition: background 0.8s, box-shadow 0.8s;
    }

    @keyframes surfaceGlow {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    .water::after {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(circle at 20% 80%, var(--accent-soft) 0%, transparent 40%),
        radial-gradient(circle at 80% 60%, var(--accent-soft) 0%, transparent 45%),
        radial-gradient(circle at 50% 30%, rgba(0,0,0,0.4) 0%, transparent 60%);
      animation: swirl 8s infinite linear;
      pointer-events: none;
    }

    @keyframes swirl {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .particle {
      position: absolute;
      background: radial-gradient(circle, #fff, var(--accent) 60%, transparent);
      border-radius: 50%;
      animation: float 3.5s infinite ease-in-out;
      pointer-events: none;
      box-shadow: 0 0 6px var(--accent);
      z-index: 3;
      transition: background 0.8s, box-shadow 0.8s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.55; }
      50% { transform: translateY(-40px) scale(1.4); opacity: 1; box-shadow: 0 0 12px var(--accent); }
    }

    /* Formula */
    .formula-box {
      background: var(--sly-card);
      border: 1px solid var(--sly-border);
      border-radius: 16px;
      padding: 22px 24px;
      margin-bottom: 24px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: background 0.8s, border-color 0.8s;
    }

    .formula-title {
      font-size: 0.85rem;
      color: var(--accent);
      margin-bottom: 10px;
      letter-spacing: 1px;
      transition: color 0.6s;
    }

    .formula {
      font-size: 1.7rem;
      font-weight: 700;
      color: var(--sly-silver);
      direction: ltr;
      font-family: 'Cinzel', serif;
      letter-spacing: 2px;
    }

    .formula span {
      color: var(--accent);
      transition: color 0.6s;
    }

    .density-result {
      margin-top: 14px;
      font-size: 1.15rem;
      color: var(--sly-silver);
    }

    .density-result strong {
      color: #7dcea0;
      font-size: 1.4rem;
    }

    /* Sliders */
    .sliders { display: grid; gap: 18px; }

    .slider-group {
      background: var(--sly-card);
      border: 1px solid var(--sly-border);
      border-radius: 14px;
      padding: 16px 18px;
      transition: background 0.8s, border-color 0.8s;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .slider-label {
      font-weight: 600;
      font-size: 1rem;
      color: var(--sly-silver);
    }

    .slider-value {
      font-weight: 700;
      color: var(--accent);
      font-size: 1.05rem;
      min-width: 100px;
      text-align: left;
      direction: ltr;
      transition: color 0.6s;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #1a2f22;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), var(--sly-green));
      cursor: pointer;
      border: 2px solid var(--sly-silver);
      box-shadow: 0 0 12px var(--accent-soft);
      transition: background 0.6s, box-shadow 0.6s;
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--sly-silver);
    }

    /* Switcher */
    .switcher {
      position: fixed;
      bottom: 28px;
      left: 28px;
      z-index: 100;
    }

    .switch-btn {
      background: linear-gradient(145deg, var(--sly-green-light), var(--sly-green));
      color: var(--sly-silver);
      border: 2px solid var(--sly-silver-dark);
      padding: 14px 22px;
      border-radius: 50px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      transition: all 0.25s ease, background 0.8s;
    }

    .switch-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px var(--accent-soft);
    }

    .shape-name {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 26, 18, 0.85);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: var(--accent);
      border: 1px solid var(--sly-border);
      letter-spacing: 1px;
      transition: color 0.6s, border-color 0.6s;
      z-index: 60;
    }

    .note {
      text-align: center;
      margin-top: 28px;
      font-size: 0.8rem;
      color: var(--sly-silver-dark);
      opacity: 0.8;
    }

    @media (max-width: 500px) {
      header h1 { font-size: 1.5rem; }
      .stage { height: 320px; }
      .formula { font-size: 1.35rem; }
      .switcher { bottom: 18px; left: 18px; }
      .switch-btn { padding: 12px 16px; font-size: 0.85rem; }
      .house-bar { top: 10px; right: 10px; padding: 10px 8px; gap: 9px; }
      .house-btn { width: 38px; height: 38px; font-size: 1.1rem; }
      .wand { height: 160px; }
      .wand-handle { height: 48px; }
      .wand-shaft { top: 46px; height: 104px; }
    }
  </style>
</head>
<body>

  <!-- House selector -->
  <div class="house-bar">
    <button class="house-btn" data-house="slytherin" title="اسلیترین">🐍</button>
    <button class="house-btn" data-house="gryffindor" title="گریفیندور">🦁</button>
    <button class="house-btn" data-house="ravenclaw" title="ریونکلاو">🦅</button>
    <button class="house-btn" data-house="hufflepuff" title="هافلپاف">🦡</button>
  </div>

  <header>
    <h1>HOGWARTS DENSITY LAB</h1>
    <p>آزمایشگاه چگالی • تغییر جرم و حجم</p>
  </header>

  <div class="lab">
    <div class="stage">
      <div class="wand">
        <div class="wand-handle"></div>
        <div class="wand-shaft"></div>
        <div class="wand-tip"></div>
      </div>
      <div class="shape-name" id="shapeName">استوانه</div>
      <div class="shape-container" id="shapeContainer"></div>
    </div>

    <div class="formula-box">
      <div class="formula-title">فرمول چگالی</div>
      <div class="formula">
        ρ = <span id="mDisplay">1000</span> / <span id="vDisplay">1000</span>
      </div>
      <div class="density-result">
        چگالی = <strong id="densityValue">1.00</strong> g/cm³
      </div>
    </div>

    <div class="sliders">
      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-label">جرم (m)</span>
          <span class="slider-value" id="massLabel">1000 g</span>
        </div>
        <input type="range" id="massSlider" min="100" max="5000" value="1000" step="10">
      </div>

      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-label">حجم (V)</span>
          <span class="slider-value" id="volumeLabel">1000 cm³</span>
        </div>
        <input type="range" id="volumeSlider" min="200" max="4000" value="1000" step="10">
      </div>
    </div>

    <p class="note">
      چگالی آب خالص ≈ ۱ g/cm³ &nbsp;|&nbsp; ρ = m ÷ V
    </p>
  </div>

  <div class="switcher">
    <button class="switch-btn" id="switchBtn">
      <span>⟳</span>
      <span id="nextShapeText">بعدی: هرم</span>
    </button>
  </div>

  <script>
    /* ===== House themes ===== */
    const themes = {
      default: {
        '--sly-bg': '#0d1a12',
        '--sly-card': '#132619',
        '--sly-border': '#2f5c40',
        '--accent': '#b44fd4',
        '--accent-soft': 'rgba(180, 79, 212, 0.5)',
        '--liquid-top': 'rgba(123, 45, 142, 0.85)',
        '--liquid-mid': '#2d1b4e',
        '--liquid-deep': '#0a0415',
        '--magic-glow': '#b44fd4'
      },
      slytherin: {
        '--sly-bg': '#07150d',
        '--sly-card': '#0f2417',
        '--sly-border': '#2a623d',
        '--accent': '#3d8b5a',
        '--accent-soft': 'rgba(61, 139, 90, 0.5)',
        '--liquid-top': 'rgba(61, 139, 90, 0.85)',
        '--liquid-mid': '#123a24',
        '--liquid-deep': '#030d07',
        '--magic-glow': '#5fe08c'
      },
      gryffindor: {
        '--sly-bg': '#1a0707',
        '--sly-card': '#2a0d0d',
        '--sly-border': '#7f1d1d',
        '--accent': '#c0392b',
        '--accent-soft': 'rgba(192, 57, 43, 0.5)',
        '--liquid-top': 'rgba(192, 57, 43, 0.85)',
        '--liquid-mid': '#4a1010',
        '--liquid-deep': '#120303',
        '--magic-glow': '#ff6b4a'
      },
      ravenclaw: {
        '--sly-bg': '#070d1a',
        '--sly-card': '#0d1a2a',
        '--sly-border': '#1e3a5f',
        '--accent': '#3a86c9',
        '--accent-soft': 'rgba(58, 134, 201, 0.5)',
        '--liquid-top': 'rgba(58, 134, 201, 0.85)',
        '--liquid-mid': '#0f2946',
        '--liquid-deep': '#02060d',
        '--magic-glow': '#5fb8ff'
      },
      hufflepuff: {
        '--sly-bg': '#1a1407',
        '--sly-card': '#2a200d',
        '--sly-border': '#8a6d1a',
        '--accent': '#d4a017',
        '--accent-soft': 'rgba(212, 160, 23, 0.5)',
        '--liquid-top': 'rgba(212, 160, 23, 0.85)',
        '--liquid-mid': '#4a3a10',
        '--liquid-deep': '#120e03',
        '--magic-glow': '#ffd84a'
      }
    };

    function applyTheme(name) {
      const theme = themes[name] || themes.default;
      const root = document.documentElement;
      for (const [k, v] of Object.entries(theme)) {
        root.style.setProperty(k, v);
      }
      document.querySelectorAll('.house-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.house === name);
      });
    }

    document.querySelectorAll('.house-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const house = btn.dataset.house;
        // If clicking the already-active house, go back to default mixed theme
        if (btn.classList.contains('active')) {
          applyTheme('default');
        } else {
          applyTheme(house);
        }
      });
    });

    /* ===== Shape logic ===== */
    const shapes = [
      { id: 'cylinder', name: 'استوانه', next: 'هرم' },
      { id: 'pyramid',  name: 'هرم',     next: 'مکعب' },
      { id: 'cube',     name: 'مکعب',    next: 'کره' },
      { id: 'sphere',   name: 'کره',     next: 'مکعب مستطیل' },
      { id: 'cuboid',   name: 'مکعب مستطیل', next: 'استوانه' }
    ];

    let currentIndex = 0;

    const shapeContainer = document.getElementById('shapeContainer');
    const shapeNameEl = document.getElementById('shapeName');
    const nextShapeText = document.getElementById('nextShapeText');
    const massSlider = document.getElementById('massSlider');
    const volumeSlider = document.getElementById('volumeSlider');
    const massLabel = document.getElementById('massLabel');
    const volumeLabel = document.getElementById('volumeLabel');
    const mDisplay = document.getElementById('mDisplay');
    const vDisplay = document.getElementById('vDisplay');
    const densityValue = document.getElementById('densityValue');
    const switchBtn = document.getElementById('switchBtn');

    function createShape(type) {
      shapeContainer.innerHTML = '';
      let el;

      if (type === 'cylinder') {
        el = document.createElement('div');
        el.className = 'cylinder';
        el.innerHTML = `<div class="water" id="water"></div>`;
      }
      else if (type === 'cube') {
        el = document.createElement('div');
        el.className = 'cube';
        el.innerHTML = `<div class="water" id="water"></div>`;
      }
      else if (type === 'cuboid') {
        el = document.createElement('div');
        el.className = 'cuboid';
        el.innerHTML = `<div class="water" id="water"></div>`;
      }
      else if (type === 'sphere') {
        el = document.createElement('div');
        el.className = 'sphere';
        el.innerHTML = `<div class="water" id="water"></div>`;
      }
      else if (type === 'pyramid') {
        el = document.createElement('div');
        el.className = 'pyramid';
        el.innerHTML = `<div class="water" id="water"></div>`;
      }

      shapeContainer.appendChild(el);
      addParticles();
      updateWaterHeight();
    }

    function addParticles() {
      const water = document.getElementById('water');
      if (!water) return;
      water.querySelectorAll('.particle').forEach(p => p.remove());

      for (let i = 0; i < 14; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 90 + 5 + '%';
        p.style.bottom = Math.random() * 70 + 10 + '%';
        p.style.animationDelay = (Math.random() * 3) + 's';
        p.style.animationDuration = (2.5 + Math.random() * 2) + 's';
        p.style.width = (3 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        water.appendChild(p);
      }
    }

    function update() {
      const mass = parseFloat(massSlider.value);
      const volume = parseFloat(volumeSlider.value);

      massLabel.textContent = mass + ' g';
      volumeLabel.textContent = volume + ' cm³';
      mDisplay.textContent = mass;
      vDisplay.textContent = volume;

      const density = mass / volume;
      densityValue.textContent = density.toFixed(2);

      if (Math.abs(density - 1) < 0.08) {
        densityValue.style.color = '#7dcea0';
      } else if (density > 1) {
        densityValue.style.color = '#f0c14b';
      } else {
        densityValue.style.color = '#5dade2';
      }

      updateWaterHeight();
    }

    function updateWaterHeight() {
      const water = document.getElementById('water');
      if (!water) return;
      const volume = parseFloat(volumeSlider.value);
      const percent = 18 + ((volume - 200) / 3800) * 74;
      water.style.height = percent + '%';
    }

    function switchShape() {
      currentIndex = (currentIndex + 1) % shapes.length;
      const shape = shapes[currentIndex];
      shapeNameEl.textContent = shape.name;
      nextShapeText.textContent = 'بعدی: ' + shape.next;
      createShape(shape.id);
      update();
    }

    massSlider.addEventListener('input', update);
    volumeSlider.addEventListener('input', update);
    switchBtn.addEventListener('click', switchShape);

    createShape('cylinder');
    update();
  </script>
</body>
</html>
